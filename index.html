<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🍡 可爱减脂饮食小本本</title>
<style>
  * { box-sizing: border-box; font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #ffeef8 0%, #fff5fb 100%);
    padding: 16px;
    max-width: 820px;
    margin: 0 auto;
    color: #4a3b46;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin: 8px 0 18px;
  }
  .card {
    background: #fff;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 6px 18px #ffd6e880;
    border: 2px solid #ffd1e8;
  }
  .row4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .metric {
    background: #ffe4f3;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .metric strong {
    display: block;
    font-size: 18px;
    margin-top: 4px;
    color: #d63384;
  }
  .tip {
    background: #fff0f9;
    border-left: 4px solid #ff7ac6;
    padding: 10px 12px;
    border-radius: 10px;
    margin: 10px 0;
    font-size: 14px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border: 2px solid #ffd1e8;
    border-radius: 14px;
    margin: 8px 0;
    font-size: 16px;
    background: #fff;
    outline: none;
  }
  input:focus, select:focus {
    border-color: #ff7ac6;
  }
  button {
    padding: 12px 16px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    cursor: pointer;
    margin: 6px 4px 6px 0;
    transition: 0.15s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff7ac6, #ff9ed4);
    color: white;
    box-shadow: 0 4px 10px #ff9ed480;
  }
  .btn-gray {
    background: #eee5ec;
    color: #5c4a58;
  }
  .btn-danger {
    background: #ffd9e6;
    color: #d63384;
  }
  .illustration-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin: 12px 0;
  }
  .food-illust {
    background: #fff0f9;
    border: 2px solid #ffd1e8;
    border-radius: 16px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    font-size: 28px;
    transition: 0.15s;
  }
  .food-illust .label {
    font-size: 12px;
    margin-top: 4px;
    color: #7a5c72;
  }
  .food-illust.active {
    background: #ff7ac6;
    color: white;
    border-color: #ff7ac6;
    transform: translateY(-2px);
  }
  .food-illust.active .label {
    color: white;
  }
  .result-box {
    background: linear-gradient(135deg, #fff0f9, #ffe4f3);
    border-radius: 16px;
    padding: 14px;
    margin-top: 12px;
  }
  .result-box p {
    margin: 6px 0;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .cal-day {
    background: #fff0f9;
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .cal-day:hover {
    background: #ffe4f3;
  }
  .cal-day.selected {
    background: #ff7ac6;
    color: white;
    border-color: #ff7ac6;
  }
  .cal-good { background: #dff7e6; }
  .cal-low { background: #dff0ff; }
  .cal-over { background: #ffe7cc; }
  .legend {
    text-align: center;
    font-size: 13px;
    margin: 8px 0;
    color: #7a5c72;
  }
  .detail-item {
    background: #fff0f9;
    border-radius: 16px;
    padding: 14px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border: 2px solid #ffd1e8;
  }
  .detail-item img {
    max-width: 220px;
    border-radius: 12px;
    margin-top: 8px;
  }
  .trash {
    background: #ffd9e6;
    color: #d63384;
    border: none;
    border-radius: 12px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 18px;
  }
  .backup-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  @media (max-width: 520px) {
    .illustration-grid { grid-template-columns: repeat(4, 1fr); }
    .row4 { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<body>
  <h1>🍡 可爱减脂饮食小本本 🍰</h1>

  <div class="row4">
    <div class="metric">📅 当前日期<br><strong id="targetDateText">今天</strong></div>
    <div class="metric">🔥 今日总热量<br><strong id="todayKcal">0 kcal</strong></div>
    <div class="metric">🥚 今日蛋白质<br><strong id="todayPro">0 g</strong></div>
    <div class="metric">🎯 热量差<br><strong id="deficit">-- kcal</strong></div>
  </div>

  <div class="card">
    <h3>📷 上传照片 + 选可爱插画</h3>
    <input type="file" id="imgUpload" accept="image/*" />
    <div id="imgPreview" style="margin-top:8px;"></div>

    <div class="tip">
      💡 点下面插画代表你吃了这份；然后填“一份总热量”和“几个人吃”，自动估算你这一份。
    </div>

    <div class="illustration-grid" id="illustrationGrid"></div>

    <label>🍽️ 这份是几个人吃的？</label>
    <select id="peopleSel">
      <option value="1">1人吃（我自己一份）</option>
      <option value="2">2人分</option>
      <option value="3" selected>3人分</option>
      <option value="4">4人分</option>
      <option value="5">5人分</option>
      <option value="6">6人分</option>
    </select>

    <label>🔥 这一份/一锅总热量大概多少大卡？</label>
    <input type="number" id="totalKcalInput" placeholder="例：整锅约 800 kcal" />

    <label>🥚 这一份/一锅总蛋白质大概多少克？</label>
    <input type="number" id="totalProInput" placeholder="例：整锅约 50 g" />

    <label>📝 备注（可选）</label>
    <input id="noteInput" placeholder="例：鸡腿肉，上面有油炸方便面，油比较多" />

    <div class="result-box" id="estimateBox">
      <p>👥 当前：<strong id="peopleShow">3人分</strong></p>
      <p>🔥 你这一份估算热量：<strong id="onePersonKcal">-- kcal</strong></p>
      <p>🥚 你这一份估算蛋白质：<strong id="onePersonPro">-- g</strong></p>
    </div>

    <button class="btn-primary" onclick="addRecord()">➕ 添加到当天</button>
    <button class="btn-gray" onclick="clearDay()">🗑 清空当天记录</button>
  </div>

  <div class="card">
    <h3>💾 备份 / 恢复</h3>
    <div class="backup-row">
      <button class="btn-primary" onclick="exportData()">📤 导出备份</button>
      <button class="btn-gray" onclick="document.getElementById('importFile').click()">📥 导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
    </div>
  </div>

  <div class="card">
    <h3>📅 点击日期补录</h3>
    <div class="legend">🟢 800-1000kcal｜🔵 ＜800kcal｜🟠 ＞1000kcal｜⚪ 无记录</div>
    <input type="month" id="monthSel" />
    <div class="calendar-grid" id="calendarBox"></div>
  </div>

  <div class="card">
    <h3>🔎 当日明细</h3>
    <div id="detailBox"></div>
  </div>

<script>
  const illustrations = [
    { id: "hotpot_chicken", icon: "🍲", label: "火锅鸡" },
    { id: "malatang", icon: "🥘", label: "麻辣烫" },
    { id: "mala_xiangguo", icon: "🌶️", label: "麻辣香锅" },
    { id: "huangmenji", icon: "🍛", label: "黄焖鸡米饭" },
    { id: "dumplings", icon: "🥟", label: "饺子" },
    { id: "xiaolongbao", icon: "🥠", label: "小笼包" },
    { id: "noodles", icon: "🍜", label: "面条" },
    { id: "rice", icon: "🍚", label: "米饭" },
    { id: "fried_chicken", icon: "🍗", label: "炸鸡" },
    { id: "burger", icon: "🍔", label: "汉堡" },
    { id: "pizza", icon: "🍕", label: "披萨" },
    { id: "grilled_fish", icon: "🐟", label: "烤鱼" },
    { id: "shrimp", icon: "🦐", label: "虾" },
    { id: "chicken_breast", icon: "🍖", label: "鸡胸肉" },
    { id: "salad", icon: "🥗", label: "沙拉" },
    { id: "milk_tea", icon: "🧋", label: "奶茶" },
    { id: "coffee", icon: "☕", label: "咖啡" },
    { id: "bread", icon: "🍞", label: "面包" },
    { id: "egg", icon: "🍳", label: "鸡蛋" },
    { id: "sweet_potato", icon: "🍠", label: "红薯" },
    { id: "corn", icon: "🌽", label: "玉米" },
    { id: "vegetables", icon: "🥬", label: "蔬菜" }
  ];

  const DAILY_TARGET = 1000;
  let records = JSON.parse(localStorage.getItem("dietRecords") || "{}");
  let targetDate = new Date().toISOString().slice(0, 10);
  let selectedImgData = null;
  let selectedIllustId = null;

  const monthSel = document.getElementById("monthSel");
  const imgUpload = document.getElementById("imgUpload");
  const imgPreview = document.getElementById("imgPreview");
  const peopleSel = document.getElementById("peopleSel");
  const totalKcalInput = document.getElementById("totalKcalInput");
  const totalProInput = document.getElementById("totalProInput");
  const noteInput = document.getElementById("noteInput");
  const targetDateText = document.getElementById("targetDateText");
  const illustrationGrid = document.getElementById("illustrationGrid");

  function init() {
    const now = new Date();
    monthSel.value = now.toISOString().slice(0, 7);
    targetDateText.textContent = targetDate;
    renderIllustrations();
    renderAll();
  }

  function renderIllustrations() {
    illustrationGrid.innerHTML = "";
    illustrations.forEach(item => {
      const div = document.createElement("div");
      div.className = "food-illust" + (selectedIllustId === item.id ? " active" : "");
      div.innerHTML = `${item.icon}<div class="label">${item.label}</div>`;
      div.onclick = () => {
        selectedIllustId = item.id;
        renderIllustrations();
      };
      illustrationGrid.appendChild(div);
    });
  }

  imgUpload.onchange = function (e) {
    const file = e.target.files[0];
    if (!file) {
      selectedImgData = null;
      imgPreview.innerHTML = "";
      return;
    }
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement("canvas");
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        selectedImgData = canvas.toDataURL("image/jpeg", 0.75);
        imgPreview.innerHTML = `<img src="${selectedImgData}" style="max-width:240px;border-radius:14px;margin-top:8px;" />`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  function updateEstimate() {
    const people = parseFloat(peopleSel.value) || 1;
    const totalKcal = parseFloat(totalKcalInput.value) || 0;
    const totalPro = parseFloat(totalProInput.value) || 0;
    const oneKcal = totalKcal / people;
    const onePro = totalPro / people;
    document.getElementById("peopleShow").textContent = people + "人分";
    document.getElementById("onePersonKcal").textContent = oneKcal > 0 ? oneKcal.toFixed(0) + " kcal" : "-- kcal";
    document.getElementById("onePersonPro").textContent = onePro > 0 ? onePro.toFixed(1) + " g" : "-- g";
  }

  peopleSel.addEventListener("input", updateEstimate);
  totalKcalInput.addEventListener("input", updateEstimate);
  totalProInput.addEventListener("input", updateEstimate);

  function addRecord() {
    if (!selectedIllustId) {
      alert("先选一个可爱插画代表你吃的食物哦 🍡");
      return;
    }
    const people = parseFloat(peopleSel.value) || 1;
    const totalKcal = parseFloat(totalKcalInput.value);
    const totalPro = parseFloat(totalProInput.value) || 0;

    if (isNaN(totalKcal)) {
      alert("请填写这份总热量 🔥");
      return;
    }

    const oneKcal = Math.round(totalKcal / people);
    const onePro = Math.round((totalPro / people) * 10) / 10;
    const illust = illustrations.find(i => i.id === selectedIllustId);

    if (!records[targetDate]) records[targetDate] = [];
    records[targetDate].push({
      id: Date.now(),
      illustId: illust.id,
      icon: illust.icon,
      label: illust.label,
      people: people,
      totalKcal: totalKcal,
      totalPro: totalPro,
      oneKcal: oneKcal,
      onePro: onePro,
      note: noteInput.value.trim(),
      photo: selectedImgData
    });

    save();
    totalKcalInput.value = "";
    totalProInput.value = "";
    noteInput.value = "";
    imgUpload.value = "";
    imgPreview.innerHTML = "";
    selectedImgData = null;
    selectedIllustId = null;
    renderIllustrations();
    updateEstimate();
    renderAll();
    alert("✅ 已添加到 " + targetDate);
  }

  function deleteRecord(id) {
    if (!confirm("删除这条记录吗？🗑️")) return;
    records[targetDate] = records[targetDate].filter(r => r.id !== id);
    if (records[targetDate].length === 0) delete records[targetDate];
    save();
    renderAll();
  }

  function clearDay() {
    if (!confirm("清空 " + targetDate + " 当天全部记录？")) return;
    delete records[targetDate];
    save();
    renderAll();
  }

  function save() {
    localStorage.setItem("dietRecords", JSON.stringify(records));
  }

  function selectDay(dayStr) {
    targetDate = dayStr;
    targetDateText.textContent = targetDate;
    renderAll();
  }

  function getDaySum(dayStr) {
    const items = records[dayStr] || [];
    let kcal = 0, pro = 0;
    items.forEach(r => {
      kcal += r.oneKcal || 0;
      pro += r.onePro || 0;
    });
    return { kcal, pro };
  }

  function getCalClass(kcal) {
    if (kcal === 0) return "";
    if (kcal < 800) return "cal-low";
    if (kcal <= 1000) return "cal-good";
    return "cal-over";
  }

  function renderCalendar() {
    const [y, m] = monthSel.value.split("-").map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    const firstWeekDay = new Date(y, m - 1, 1).getDay();
    const box = document.getElementById("calendarBox");
    box.innerHTML = "";

    for (let i = 0; i < firstWeekDay; i++) {
      const empty = document.createElement("div");
      empty.style.visibility = "hidden";
      box.appendChild(empty);
    }

    for (let d = 1; d <= lastDay; d++) {
      const dayStr = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const sum = getDaySum(dayStr);
      const div = document.createElement("div");
      div.className = "cal-day " + getCalClass(sum.kcal) + (dayStr === targetDate ? " selected" : "");
      div.innerHTML = `${d}号<br>${sum.kcal}kcal`;
      div.onclick = () => selectDay(dayStr);
      box.appendChild(div);
    }
  }

  function renderDetail() {
    const box = document.getElementById("detailBox");
    const items = records[targetDate] || [];
    if (items.length === 0) {
      box.innerHTML = `<p>📭 ${targetDate} 还没有记录哦，快去添加吧～</p>`;
      return;
    }

    const sum = getDaySum(targetDate);
    let html = `<p>📅 <strong>${targetDate}</strong>｜今日总热量：<strong>${sum.kcal} kcal</strong>｜蛋白质：<strong>${sum.pro.toFixed(1)} g</strong></p>`;

    items.forEach(r => {
      html += `
        <div class="detail-item">
          <div>
            <div style="font-size:30px;">${r.icon}</div>
            <div><strong>${r.label}</strong></div>
            <div style="font-size:14px;color:#7a5c72;margin-top:4px;">
              这份 ${r.people}人分｜整份约 ${r.totalKcal}kcal${r.totalPro ? " / " + r.totalPro + "g蛋白" : ""}
            </div>
            <div style="font-size:14px;color:#d63384;margin-top:4px;">
              👉 你这一份约 ${r.oneKcal}kcal / ${r.onePro.toFixed(1)}g蛋白
            </div>
            ${r.note ? `<div style="font-size:13px;color:#7a5c72;margin-top:4px;">📝 ${r.note}</div>` : ""}
            ${r.photo ? `<img src="${r.photo}" />` : ""}
          </div>
          <button class="trash" onclick="deleteRecord(${r.id})">🗑</button>
        </div>`;
    });

    box.innerHTML = html;
  }

  function renderTopMetrics() {
    const today = new Date().toISOString().slice(0, 10);
    const sum = getDaySum(today);
    document.getElementById("todayKcal").textContent = sum.kcal + " kcal";
    document.getElementById("todayPro").textContent = sum.pro.toFixed(1) + " g";
    const deficit = DAILY_TARGET - sum.kcal;
    document.getElementById("deficit").textContent = deficit + " kcal";
  }

  function renderAll() {
    renderCalendar();
    renderDetail();
    renderTopMetrics();
  }

  monthSel.addEventListener("change", renderCalendar);

  function exportData() {
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `diet_backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (!confirm("导入会合并当前记录，同一天会覆盖，确定继续吗？")) return;
        records = { ...records, ...imported };
        save();
        renderAll();
        alert("✅ 导入成功");
      } catch (err) {
        alert("❌ 备份文件解析失败");
      }
    };
    reader.readAsText(file);
  }

  init();
</script>
</body>
</html>
