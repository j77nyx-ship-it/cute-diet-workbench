<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减脂饮食工作台</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{background:#fff7fa;padding:16px;max-width:800px;margin:0 auto;color:#333;}
.card{background:#ffffff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 1px 6px #00000015;border:1px solid #f8d8e4;}
h1{text-align:center;font-size:22px;margin:8px 0 20px;}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px;}
.metric{background:#ffe8f0;border-radius:12px;padding:12px;text-align:center;font-size:14px;}
.metric strong{font-size:17px;display:block;margin-top:4px;}
input,select{width:100%;padding:12px;border:1px solid #e2c8d4;border-radius:12px;margin:8px 0;font-size:16px;background:#fff;}
button{padding:12px 16px;border:none;border-radius:12px;font-size:16px;cursor:pointer;margin:6px 4px 6px 0;}
.btn-primary{background:#ff77aa;color:white;}
.btn-gray{background:#dddddd;color:#333;}
.trash-btn{background:transparent;color:#e63962;font-size:22px;border:none;padding:4px;cursor:pointer;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;}
.cal-day{border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;background:#ffe8f0;cursor:pointer;}
.cal-day.selected{outline:3px solid #ff77aa;}
.legend{text-align:center;font-size:13px;margin:8px 0;color:#666;}
.detail-item{background:#fff0f6;border-radius:12px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:flex-start;}
.selected-tip{background:#ffe8f0;color:#b82e5c;padding:10px;border-radius:10px;margin:8px 0;font-size:17px;}
img.preview{max-width:240px;border-radius:10px;margin:8px 0;}
</style>
</head>
<body>
<h1>🍡减脂饮食工作台</h1>
<div class="row4">
<div class="metric">今日总热量<strong id="today-kcal">0 kcal</strong></div>
<div class="metric">蛋白质<strong id="today-pro">0 g</strong></div>
<div class="metric">碳水<strong id="today-carb">0 g</strong></div>
<div class="metric">脂肪<strong id="today-fat">0 g</strong></div>
</div>

<div class="card">
<h3>📝 添加/补录饮食记录 📷相册选图存档</h3>
<div class="selected-tip">当前录入日期：<span id="target-date-text"></span></div>
<select id="meal-sel">
<option value="breakfast">🌞早餐</option>
<option value="lunch">☀️午餐</option>
<option value="dinner">🌙晚餐</option>
<option value="snack">🍬加餐</option>
</select>
<input id="food-input" placeholder="食物名称，逗号分隔，例：火锅鸡，方便面">
<input id="note-input" placeholder="分量备注、几人吃、手动估算热量，这里仅做备注">
<input type="file" id="file-upload" accept="image/*">
<div id="img-preview-wrap"></div>
<div>
<button class="btn-primary" onclick="addRecord()">➕添加记录</button>
<button class="btn-gray" onclick="clearToday()">🗑清空今日全部</button>
</div>
</div>

<div class="card">
<h3>📅 整月日历（点击日期，下方直接显示明细，同时可补录）</h3>
<div class="legend">🟢正常｜🔵偏低｜🟠偏高｜🌸无记录</div>
<input type="month" id="month-sel">
<div class="calendar-grid" id="calendar-box"></div>
</div>

<div class="card">
<h3>🔍当日明细（🗑单条删除）</h3>
<div id="detail-box"></div>
</div>

<script>
// ==========【扩充大量外卖、餐馆日常食物库】============
const foodDb = {
//主食米面类
"白米饭":{"kcal":116,"pro":2.6,"carb":25.9,"fat":0.3},
"藜麦":{"kcal":120,"pro":4.4,"carb":21.3,"fat":1.9},
"方便面":{"kcal":473,"pro":9.5,"carb":61,"fat":21.6},
"油炸面条":{"kcal":460,"pro":9,"carb":60,"fat":22},
"馒头":{"kcal":223,"pro":7,"carb":47,"fat":1.1},
"小笼包":{"kcal":230,"pro":8,"carb":30,"fat":8},
"饺子":{"kcal":230,"pro":9,"carb":28,"fat":9},
"面条熟":{"kcal":130,"pro":4,"carb":25,"fat":0.5},
"手抓饼":{"kcal":386,"pro":7,"carb":40,"fat":22},
"煎饼果子":{"kcal":320,"pro":12,"carb":40,"fat":12},
"河粉":{"kcal":110,"pro":2,"carb":24,"fat":0.3},
"米粉":{"kcal":115,"pro":2.2,"carb":25,"fat":0.4},
"红薯":{"kcal":86,"pro":1.6,"carb":20,"fat":0.1},
"玉米":{"kcal":106,"pro":4,"carb":21,"fat":1.3},

//禽肉
"鸡胸肉":{"kcal":118,"pro":23,"carb":0,"fat":2.5},
"鸡腿肉":{"kcal":157,"pro":20,"carb":0,"fat":7.5},
"火锅鸡":{"kcal":260,"pro":20,"carb":8,"fat":14},
"黄焖鸡":{"kcal":240,"pro":22,"carb":12,"fat":11},
"奥尔良烤鸡":{"kcal":210,"pro":24,"carb":6,"fat":9},
"炸鸡块":{"kcal":270,"pro":18,"carb":14,"fat":16},

//牛羊猪
"瘦牛肉":{"kcal":125,"pro":22,"carb":0,"fat":4.2},
"瘦猪肉":{"kcal":143,"pro":20,"carb":0,"fat":6.2},
"红烧排骨":{"kcal":264,"pro":16,"carb":7,"fat":18},
"红烧肉":{"kcal":400,"pro":13,"carb":12,"fat":34},

//水产
"鱼":{"kcal":110,"pro":18,"carb":0,"fat":3},
"水煮鱼":{"kcal":280,"pro":19,"carb":4,"fat":19},
"虾":{"kcal":93,"pro":18,"carb":0,"fat":1.4},

//家常菜外卖高频
"番茄炒蛋":{"kcal":150,"pro":7,"carb":7,"fat":10},
"青椒肉丝":{"kcal":180,"pro":14,"carb":6,"fat":11},
"鱼香肉丝":{"kcal":210,"pro":10,"carb":15,"fat":12},
"宫保鸡丁":{"kcal":230,"pro":14,"carb":14,"fat":14},
"麻婆豆腐":{"kcal":180,"pro":10,"carb":8,"fat":12},
"地三鲜":{"kcal":250,"pro":4,"carb":22,"fat":17},
"手撕包菜":{"kcal":110,"pro":2,"carb":7,"fat":8},
"蒜蓉油麦菜":{"kcal":80,"pro":2,"carb":5,"fat":6},

//卤味小吃
"卤鸡腿":{"kcal":220,"pro":24,"carb":3,"fat":11},
"卤牛肉":{"kcal":250,"pro":30,"carb":2,"fat":12},
"豆腐皮":{"kcal":245,"pro":24,"carb":12,"fat":12},
"茶叶蛋":{"kcal":140,"pro":12,"carb":2,"fat":9},
"鸡蛋":{"kcal":143,"pro":13,"carb":1.1,"fat":9.9},

//奶茶饮品
"纯豆浆":{"kcal":40,"pro":3,"carb":5,"fat":1},
"拿铁不另外加糖":{"kcal":90,"pro":4,"carb":6,"fat":5},
"牛奶":{"kcal":60,"pro":3.2,"carb":4.8,"fat":3.2},

//火锅类
"肥牛卷":{"kcal":250,"pro":18,"carb":0,"fat":19},
"肥羊卷":{"kcal":240,"pro":16,"carb":0,"fat":18},
"火锅丸子混合":{"kcal":220,"pro":10,"carb":15,"fat":13},

//快餐简餐
"麻辣烫单人份":{"kcal":420,"pro":22,"carb":35,"fat":22},
"麻辣香锅单人份":{"kcal":520,"pro":24,"carb":30,"fat":32},
"黄焖鸡米饭整套":{"kcal":550,"pro":30,"carb":60,"fat":22},
"沙县蒸饺一笼":{"kcal":330,"pro":14,"carb":36,"fat":14},

//素菜
"西兰花":{"kcal":34,"pro":2.8,"carb":6,"fat":0.4},
"菠菜":{"kcal":28,"pro":2.6,"carb":4.5,"fat":0.3},
"生菜":{"kcal":16,"pro":1.2,"carb":2.9,"fat":0.2},
"黄瓜":{"kcal":16,"pro":0.7,"carb":3.6,"fat":0.2}
};

const mealMap={breakfast:"🌞早餐",lunch:"☀️午餐",dinner:"🌙晚餐",snack:"🍬加餐"};
let targetDate;
let records=JSON.parse(localStorage.getItem("diet_records")||"{}");
let imgData=null;

const monthSel=document.getElementById("month-sel");
const calendarBox=document.getElementById("calendar-box");
const detailBox=document.getElementById("detail-box");
const targetDateText=document.getElementById("target-date-text");
const foodInput=document.getElementById("food-input");
const noteInput=document.getElementById("note-input");
const mealSel=document.getElementById("meal-sel");
const imgPreviewWrap=document.getElementById("img-preview-wrap");
const fileUpload=document.getElementById("file-upload");

function getTodayStr(){
    const d=new Date();
    return d.toISOString().slice(0,10);
}

function init(){
    const now=new Date();
    targetDate=getTodayStr();
    monthSel.value=now.toISOString().slice(0,7);
    targetDateText.innerText=targetDate;
    renderCalendar();
    renderDetail();
    renderTodaySum();
}

fileUpload.onchange=function(e){
    const f=e.target.files[0];
    if(!f){imgData=null;imgPreviewWrap.innerHTML="";return;}
    const reader=new FileReader();
    reader.onload=ev=>{
        imgData=ev.target.result;
        imgPreviewWrap.innerHTML=`<img class="preview" src="${imgData}">`;
    }
    reader.readAsDataURL(f);
}

function parseFoodText(text){
    const out={kcal:0,pro:0,carb:0,fat:0};
    const arr=text.split(/[,，]/).map(s=>s.trim().toLowerCase()).filter(s=>s);
    for(const name of arr){
        if(foodDb[name]){
            out.kcal+=foodDb[name].kcal;
            out.pro+=foodDb[name].pro;
            out.carb+=foodDb[name].carb;
            out.fat+=foodDb[name].fat;
        }
    }
    return out;
}

function addRecord(){
    const foodText=foodInput.value.trim();
    const note=noteInput.value.trim();
    const meal=mealSel.value;
    if(!foodText){alert("请填写食物名称");return;}
    const nutr=parseFoodText(foodText);
    if(!records[targetDate]) records[targetDate]=[];
    records[targetDate].push({
        id:Date.now(),
        meal,
        foodText,
        note,
        nutr,
        img:imgData
    });
    saveStorage();
    foodInput.value="";noteInput.value="";fileUpload.value=null;imgData=null;imgPreviewWrap.innerHTML="";
    renderCalendar();renderDetail();renderTodaySum();
}

function saveStorage(){
    localStorage.setItem("diet_records",JSON.stringify(records));
}

function deleteRecord(dateStr,id){
    const arr=records[dateStr];
    records[dateStr]=arr.filter(r=>r.id!==id);
    if(records[dateStr].length===0) delete records[dateStr];
    saveStorage();
    renderCalendar();renderDetail();renderTodaySum();
}

function clearToday(){
    if(!confirm(`确定清空${targetDate}全部记录？`)) return;
    delete records[targetDate];
    saveStorage();
    renderCalendar();renderDetail();renderTodaySum();
}

function selectDay(d){
    targetDate=d;
    targetDateText.innerText=d;
    renderCalendar();
    renderDetail();
}

function renderCalendar(){
    const ym=monthSel.value;
    const y=Number(ym.split("-")[0]);
    const m=Number(ym.split("-")[1])-1;
    calendarBox.innerHTML="";
    const first=new Date(y,m,1);
    const last=new Date(y,m+1,0);
    const startWeek=first.getDay();
    for(let i=0;i<startWeek;i++){
        const div=document.createElement("div");div.className="cal-day";div.style.visibility="hidden";calendarBox.appendChild(div);
    }
    for(let d=1;d<=last.getDate();d++){
        const dateStr=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const dayRec=records[dateStr]||[];
        let sumK=0;
        dayRec.forEach(r=>sumK+=r.nutr.kcal);
        const div=document.createElement("div");
        div.className="cal-day"+(dateStr===targetDate?" selected":"");
        div.innerHTML=`${d}号<br>${sumK}kcal`;
        div.onclick=()=>selectDay(dateStr);
        calendarBox.appendChild(div);
    }
}

function renderDetail(){
    const arr=records[targetDate]||[];
    if(arr.length===0){
        detailBox.innerHTML=`<p>📭${targetDate}｜暂无饮食记录</p>`;
        return;
    }
    let sumK=0,sumP=0,sumC=0,sumF=0;
    let html=`<p>📅${targetDate}｜总热量：<strong>${arr.reduce((s,r)=>s+r.nutr.kcal,0)}kcal</strong>｜蛋白：${arr.reduce((s,r)=>s+r.nutr.pro,0).toFixed(1)}g</p>`;
    arr.forEach(rec=>{
        sumK+=rec.nutr.kcal;sumP+=rec.nutr.pro;sumC+=rec.nutr.carb;sumF+=rec.nutr.fat;
        html+=`<div class="detail-item">
        <div>
        <div>${mealMap[rec.meal]}｜${rec.foodText}</div>
        <div style="font-size:14px;color:#555;">${rec.note||""}</div>
        <div style="font-size:13px;color:#777;">${rec.nutr.kcal}kcal 蛋白${rec.nutr.pro}g 碳水${rec.nutr.carb}g 脂肪${rec.nutr.fat}g</div>
        ${rec.img?`<img class="preview" src="${rec.img}">`:""}
        </div>
        <button class="trash-btn" onclick="deleteRecord('${targetDate}',${rec.id})">🗑</button>
        </div>`;
    })
    detailBox.innerHTML=html;
}

function renderTodaySum(){
    const today=getTodayStr();
    const arr=records[today]||[];
    let k=0,p=0,c=0,f=0;
    arr.forEach(r=>{k+=r.nutr.kcal;p+=r.nutr.pro;c+=r.nutr.carb;f+=r.nutr.fat;});
    document.getElementById("today-kcal").innerText=`${k} kcal`;
    document.getElementById("today-pro").innerText=`${p.toFixed(1)} g`;
    document.getElementById("today-carb").innerText=`${c.toFixed(1)} g`;
    document.getElementById("today-fat").innerText=`${f.toFixed(1)} g`;
}

monthSel.onchange=()=>renderCalendar();
init();
</script>
</body>
</html>
