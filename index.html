<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>减脂饮食小工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%233e7a55'/><path d='M10 22 L22 10' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#f4f5f3;
  --card:#ffffff;
  --border:#e3e6e1;
  --line:#eef0ec;
  --text:#2b322d;
  --muted:#7c857e;
  --accent:#3e7a55;
  --accent-hover:#35694a;
  --accent-soft:#e9f1ec;
  --danger:#c94f4f;
  --shadow:0 1px 2px rgba(20,40,30,.05), 0 4px 16px rgba(20,40,30,.05);
}
*{box-sizing:border-box;}
html,body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  padding:0 0 40px;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:720px;
  margin:0 auto;
  padding:20px 14px;
}
.page-head{text-align:center;padding:6px 0 18px;}
.page-head h1{
  margin:0;
  font-size:22px;
  font-weight:700;
  color:var(--text);
  letter-spacing:.5px;
}
.page-sub{
  margin:6px 0 0;
  font-size:13px;
  color:var(--muted);
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
h3{
  margin:0 0 4px;
  font-size:16px;
  color:var(--text);
}
h4{
  margin:6px 0 10px;
  font-size:14px;
  color:var(--text);
}
.label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:10px 0;
  align-items:center;
}
.row>select,.row>input{flex:1;min-width:0;}
.row>button{flex:0 0 auto;}
select,input,textarea{
  padding:11px 12px;
  border-radius:10px;
  border:1px solid #d6dbd6;
  font-size:16px;
  background:#fff;
  color:var(--text);
  outline:none;
  transition:border-color .15s, box-shadow .15s;
  min-width:0;
}
select:focus,input:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
textarea{font-family:inherit;resize:vertical;}
button{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:11px 18px;
  border-radius:10px;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  min-height:44px;
  transition:background .15s;
}
button:hover{background:var(--accent-hover);}
button:active{transform:translateY(1px);}
.btn-del{
  background:#f3e9e9;
  color:var(--danger);
  padding:6px 12px;
  font-size:13px;
  border-radius:8px;
  min-height:36px;
}
.btn-del:hover{background:#e8d6d6;}
.btn-ghost{
  background:transparent;
  color:var(--accent);
  border:1px solid var(--accent);
}
.btn-ghost:hover{background:var(--accent-soft);}
.tip{font-size:13px;color:var(--muted);line-height:1.6;}

/* 顶部统计 */
.stat{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin:14px 0;
}
.stat>div{
  background:#f2f5f3;
  border:1px solid var(--line);
  border-radius:12px;
  text-align:center;
  padding:12px 4px;
  font-size:13px;
  color:var(--muted);
  min-width:0;
}
.stat>div span{
  display:block;
  font-size:20px;
  font-weight:700;
  color:var(--accent);
  margin-bottom:2px;
}
.stat-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:10px 0;
}
.stat-row>div{
  background:#f2f5f3;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  font-size:13px;
  color:var(--muted);
}
.stat-row input{width:100%;margin-top:6px;}

/* 营养输入：桌面 5 列 */
.nutri-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:8px 0;
}
.nutri-grid input{width:100%;}

.photo-area{margin-top:12px;}
.photo-img{max-width:110px;border-radius:8px;margin:4px;cursor:pointer;}
.preview-wrap img{max-width:110px;border-radius:8px;}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:999;
  align-items:center;
  justify-content:center;
}
.modal img{max-width:92%;max-height:92%;border-radius:8px;}
.modal.show{display:flex;}
.msg-tip{
  padding:9px 12px;
  border-radius:8px;
  margin:8px 0;
  font-size:14px;
  display:none;
}
.msg-success{background:#e7f3ea;color:#2f6b43;}
.msg-warn{background:#fdf1e3;color:#9a5c16;}
hr.rule{border:none;border-top:1px dashed var(--line);margin:16px 0;}

/* 日历 */
.calendar-week-header{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-bottom:6px;
}
.week-label{text-align:center;font-size:13px;font-weight:600;color:var(--muted);}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:8px;
}
.calendar-day{
  border-radius:10px;
  padding:9px 2px;
  min-height:82px;
  text-align:center;
  cursor:pointer;
  font-size:12px;
  line-height:1.45;
  border:1px solid transparent;
  min-width:0;
  overflow:hidden;
}
.calendar-day:hover{filter:brightness(.96);}
.cal-empty{background:#eef0ed;color:#a0a7a1;}
.cal-low{background:#e4eef7;color:#3a6a92;}
.cal-good{background:#e4efe6;color:#35694a;}
.cal-over{background:#faebdd;color:#9a5c16;}
.legend{font-size:13px;color:var(--muted);margin:6px 0 2px;text-align:center;}
.legend b{font-weight:600;}

.day-detail{
  margin-top:14px;
  padding:16px;
  background:#f7f9f7;
  border:1px solid var(--line);
  border-radius:14px;
  display:none;
}
.meal-item{
  display:flex;
  gap:12px;
  align-items:flex-start;
  justify-content:space-between;
  padding:11px 2px;
  border-bottom:1px dashed var(--line);
}
.meal-item:last-child{border-bottom:none;}
.stat-line{font-size:14px;font-weight:600;margin-bottom:6px;}
.ex-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 2px;
  border-bottom:1px dashed var(--line);
}
.ex-item:last-child{border-bottom:none;}
.ai-box{background:#f7f9f7;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;}
.ai-result{
  background:#fff;
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  min-height:90px;
  margin-top:8px;
  white-space:pre-wrap;
  font-size:14px;
  line-height:1.7;
}
.advice-saved{
  margin-top:10px;
  padding:10px;
  background:#f0f5f1;
  border-radius:10px;
  font-size:14px;
  line-height:1.7;
}
.advice-saved strong{color:var(--accent);}

/* 窄屏适配 */
@media (max-width:560px){
  .stat{grid-template-columns:repeat(2,1fr);}
  .stat .stat-fib{grid-column:1 / -1;}
  .nutri-grid{grid-template-columns:repeat(2,1fr);}
  .nutri-grid #fibInput{grid-column:1 / -1;}
  .card{padding:16px;}
}
</style>
</head>
<body>
<div class="wrap">
<header class="page-head">
  <h1>减脂饮食小工作台</h1>
  <p class="page-sub">记录每日饮食 · 运动 · 体重，支持补录历史日期</p>
</header>

<div class="card">
  <label class="label" for="recordDatePicker">录入日期（可补录历史）</label>
  <div class="row">
    <input type="date" id="recordDatePicker">
  </div>

  <div class="stat">
    <div><span id="showTotalKcal">0</span>总摄入 kcal</div>
    <div><span id="showExBurn">0</span>运动消耗 kcal</div>
    <div><span id="showNetKcal">0</span>净摄入 kcal</div>
    <div><span id="showTotalPro">0</span>蛋白合计 g</div>
    <div class="stat-fib"><span id="showTotalFib">0</span>纤维合计 g</div>
  </div>
  <div class="stat-row">
    <div>晨起体重(kg)
      <input type="text" id="morningWeight" placeholder="例如58.0" oninput="this.value=this.value.replace(/[^0-9.]/g,'')" onblur="saveWeight()">
    </div>
    <div>晚间体重(kg)
      <input type="text" id="nightWeight" placeholder="例如58.3" oninput="this.value=this.value.replace(/[^0-9.]/g,'')" onblur="saveWeight()">
    </div>
  </div>

  <div id="msgBox" class="msg-tip"></div>

  <div class="row">
    <select id="mealType">
      <option value="breakfast">早餐</option>
      <option value="lunch">午餐</option>
      <option value="dinner">晚餐</option>
      <option value="snack">加餐/零食</option>
    </select>
    <input id="foodInput" placeholder="粘贴豆包营养文本自动识别，或：食物名｜热量｜蛋白｜碳水｜脂肪｜纤维" oninput="autoFillNutrition()">
  </div>
  <div class="nutri-grid">
    <input id="kcalInput" placeholder="热量 kcal">
    <input id="proInput" placeholder="蛋白质 g">
    <input id="choInput" placeholder="碳水 g">
    <input id="fatInput" placeholder="脂肪 g">
    <input id="fibInput" placeholder="膳食纤维 g">
  </div>

  <div class="photo-area">
    <button class="btn-ghost" onclick="document.getElementById('uploadPhoto').click()">上传餐食照片</button>
    <input type="file" id="uploadPhoto" accept="image/*" onchange="handlePhoto(event)" style="display:none;">
    <div id="previewBox" class="preview-wrap"></div>
  </div>

  <div class="row" style="margin-top:12px;">
    <button onclick="addFoodRecord()">添加记录</button>
    <button class="btn-ghost" onclick="clearToday()">清空当日</button>
    <button class="btn-ghost" onclick="exportJson()">导出备份</button>
  </div>
  <div class="tip">
    使用：先选「录入日期」，再填食物 / 体重。输入体重后点空白处保存。
    <br>定期「导出备份」，清浏览器缓存会丢失数据。
  </div>

  <hr class="rule">
  <h4>运动消耗记录</h4>
  <div class="row">
    <input id="exNameInput" placeholder="运动名称">
    <input type="number" id="exBurnInput" placeholder="消耗热量kcal" min="0">
    <button onclick="addExercise()">添加</button>
  </div>
  <div id="todayExerciseList"></div>
</div>

<div class="card">
  <label class="label" for="monthPicker">选择月份查看：</label>
  <input type="month" id="monthPicker"/>
  <div class="legend"><b>绿色</b> 正常 800-1000 ｜ <b>蓝色</b> 偏少 &lt;800 ｜ <b>橙色</b> 超标 &gt;1000 ｜ <b>灰色</b> 无记录</div>
  <div class="calendar-week-header" id="weekHeader">
    <div class="week-label">日</div>
    <div class="week-label">一</div>
    <div class="week-label">二</div>
    <div class="week-label">三</div>
    <div class="week-label">四</div>
    <div class="week-label">五</div>
    <div class="week-label">六</div>
  </div>
  <div class="calendar-grid" id="calendarBox"></div>
  <div class="day-detail" id="dayDetailBox"></div>
</div>

<div class="card">
  <h3>饮食 AI 助手</h3>
  <div class="tip">点击「复制记录」，把文本发给豆包，拿到建议再粘贴回来保存。</div>
  <div class="row">
    <button onclick="copyTodayLog()">复制【当前选中日期】记录</button>
  </div>
  <div class="ai-box">
    <label class="label" for="aiSuggestInput">粘贴 AI 返回的饮食建议，保存到当前选中日期：</label>
    <textarea id="aiSuggestInput" style="width:100%;height:120px;"></textarea>
    <div class="row">
      <button onclick="saveAiAdvice()">保存建议</button>
    </div>
    <div class="label">当日保存的建议：</div>
    <div class="ai-result" id="aiAdviceShow">暂无</div>
  </div>
</div>

<div class="modal" id="imgModal" onclick="closeModal()">
  <img id="modalImg">
</div>
</div>

<script>
let capturedImageBase64 = "";

// 获取当前选中的录入日期（用于补录）
function getSelectedDateStr(){
  return document.getElementById("recordDatePicker").value;
}

function showMsg(text,isSuccess=true){
  const box = document.getElementById("msgBox");
  box.innerText = text;
  box.style.display="block";
  box.className = isSuccess?"msg-tip msg-success":"msg-tip msg-warn";
  setTimeout(()=>{box.style.display="none";},1800);
}

function parseNum(raw){
  const m = String(raw==null?"":raw).match(/[\d.]+/);
  return m ? Number(m[0]) : 0;
}

// 粘贴豆包营养文本自动识别填充（兼容竖线格式与自然语言格式）
function autoFillNutrition(){
  const text = document.getElementById("foodInput").value.trim();
  if(!text) return;

  // 1) 竖线格式：食物名｜热量｜蛋白｜碳水｜脂肪｜纤维
  if(text.includes("｜") || text.includes("|")){
    const parts = text.split(/[｜|]/);
    if(parts.length >= 2){
      document.getElementById("kcalInput").value = parseNum(parts[1]);
      if(parts[2]) document.getElementById("proInput").value = parseNum(parts[2]);
      if(parts[3]) document.getElementById("choInput").value = parseNum(parts[3]);
      if(parts[4]) document.getElementById("fatInput").value = parseNum(parts[4]);
      if(parts[5]) document.getElementById("fibInput").value = parseNum(parts[5]);
      return;
    }
  }

  // 2) 豆包自然语言格式，如：热量：约 275 kcal，蛋白质：3 g，碳水：28 g，脂肪：17 g，膳食纤维：1.2 g
  const rules = [
    {id:"kcalInput", re:/热量\s*[：:]?\s*(?:约|大约|约等于)?\s*([\d.]+)\s*(?:kcal|千卡|大卡)?/i},
    {id:"proInput",  re:/蛋白(?:质)?\s*[：:]?\s*(?:约|大约)?\s*([\d.]+)\s*(?:g|克)?/i},
    {id:"choInput",  re:/碳水(?:化合物)?\s*[：:]?\s*(?:约|大约)?\s*([\d.]+)\s*(?:g|克)?/i},
    {id:"fatInput",  re:/脂肪\s*[：:]?\s*(?:约|大约)?\s*([\d.]+)\s*(?:g|克)?/i},
    {id:"fibInput",  re:/(?:膳食)?纤维\s*[：:]?\s*(?:约|大约)?\s*([\d.]+)\s*(?:g|克)?/i}
  ];
  rules.forEach(r=>{
    const m = text.match(r.re);
    if(m){ document.getElementById(r.id).value = parseNum(m[1]); }
  });

  // 3) 顺带识别食物名称，如：鸡蛋（1个）：热量70kcal，蛋白质6g...
  const stop = /^(热量|能量|每100|每份|营养|成分|约)/;
  const nm = text.match(/^(.{1,20})[：:]/);
  if(nm && !stop.test(nm[1]) && nm[1].indexOf("｜") === -1){
    document.getElementById("foodInput").value = nm[1].trim();
  }
}

function getAllRecords(){
  let raw = localStorage.getItem("dietLog");
  return raw ? JSON.parse(raw) : {};
}
function saveAllRecords(obj){
  localStorage.setItem("dietLog",JSON.stringify(obj));
}

function getTodayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function compressImage(file,maxW=1080,quality=0.6){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.readAsDataURL(file);
    reader.onload=ev=>{
      const img=new Image();
      img.src=ev.target.result;
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        let w=img.width;
        let h=img.height;
        if(w>maxW){
          h=h*(maxW/w);
          w=maxW;
        }
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      }
    }
  })
}

async function handlePhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  capturedImageBase64 = await compressImage(file);
  document.getElementById("previewBox").innerHTML = `<img src="${capturedImageBase64}" style="max-width:110px;border-radius:8px;">`;
}

function openModal(src){
  document.getElementById("modalImg").src = src;
  document.getElementById("imgModal").classList.add("show");
}
function closeModal(){
  document.getElementById("imgModal").classList.remove("show");
}

// 保存体重：保存到【选中的日期】，不再固定今天
function saveWeight(){
  const dayKey = getSelectedDateStr();
  const all = getAllRecords();
  if(!all[dayKey]) all[dayKey]={items:[],exercises:[],advice:"",wMorning:"",wNight:""};
  all[dayKey].wMorning = document.getElementById("morningWeight").value.trim();
  all[dayKey].wNight = document.getElementById("nightWeight").value.trim();
  saveAllRecords(all);
  renderMonth();
}

// 切换补录日期，自动加载那天的体重数据
function bindWeightInput(){
  const dayKey = getSelectedDateStr();
  const all = getAllRecords();
  if(!all[dayKey]) all[dayKey]={items:[],exercises:[],advice:"",wMorning:"",wNight:""};
  document.getElementById("morningWeight").value = all[dayKey].wMorning||"";
  document.getElementById("nightWeight").value = all[dayKey].wNight||"";

  // 加载当日运动列表
  let exHtml="";
  if(all[dayKey] && Array.isArray(all[dayKey].exercises)){
    all[dayKey].exercises.forEach((ex,idx)=>{
      exHtml += `<div class="ex-item">${ex.name}｜消耗 ${ex.burn} kcal
      <button class="btn-del" onclick="deleteExercise(${idx})">删除</button></div>`
    })
  }
  document.getElementById("todayExerciseList").innerHTML = exHtml || `<div class="tip">该日暂无运动记录</div>`;
  document.getElementById("aiAdviceShow").innerText = (all[dayKey]?.advice)||"暂无";
  document.getElementById("aiSuggestInput").value = (all[dayKey]?.advice)||"";

  // 更新顶部统计
  const t = getDayTotal(all[dayKey]);
  document.getElementById("showTotalKcal").innerText = t.kcal;
  document.getElementById("showExBurn").innerText = t.exBurn;
  document.getElementById("showNetKcal").innerText = t.net;
  document.getElementById("showTotalPro").innerText = t.pro.toFixed(1);
  document.getElementById("showTotalFib").innerText = t.fib.toFixed(1);
}

function addFoodRecord(){
  const foodText = document.getElementById("foodInput").value.trim();
  const kcal = Number(document.getElementById("kcalInput").value)||0;
  const pro = Number(document.getElementById("proInput").value)||0;
  const cho = Number(document.getElementById("choInput").value)||0;
  const fat = Number(document.getElementById("fatInput").value)||0;
  const fib = Number(document.getElementById("fibInput").value)||0;

  const mealSel = document.getElementById("mealType").value;
  if(!foodText){
    showMsg("请输入食物名称",false);
    return;
  }
  const dayKey = getSelectedDateStr();
  const all = getAllRecords();
  if(!all[dayKey]) all[dayKey] = {items:[],exercises:[],advice:"",wMorning:"",wNight:""};
  if(!Array.isArray(all[dayKey].items)) all[dayKey].items = [];
  if(!Array.isArray(all[dayKey].exercises)) all[dayKey].exercises=[];

  all[dayKey].items.push({
    meal:mealSel,
    foodText:foodText,
    photo:capturedImageBase64,
    kcal:kcal,
    pro:pro,
    cho:cho,
    fat:fat,
    fib:fib,
    ts:Date.now()
  });
  saveAllRecords(all);

  document.getElementById("foodInput").value="";
  document.getElementById("kcalInput").value="";
  document.getElementById("proInput").value="";
  document.getElementById("choInput").value="";
  document.getElementById("fatInput").value="";
  document.getElementById("fibInput").value="";
  document.getElementById("previewBox").innerHTML="";
  capturedImageBase64="";

  renderMonth();
  bindWeightInput();
  showMsg("记录保存成功");
}

function addExercise(){
  const exName = document.getElementById("exNameInput").value.trim();
  const exBurn = Number(document.getElementById("exBurnInput").value)||0;
  if(!exName){
    showMsg("请填写运动名称",false);
    return;
  }
  const dayKey = getSelectedDateStr();
  const all = getAllRecords();
  if(!all[dayKey]) all[dayKey]={items:[],exercises:[],advice:"",wMorning:"",wNight:""};
  if(!Array.isArray(all[dayKey].exercises)) all[dayKey].exercises=[];
  all[dayKey].exercises.push({name:exName,burn:exBurn,ts:Date.now()});
  saveAllRecords(all);

  document.getElementById("exNameInput").value="";
  document.getElementById("exBurnInput").value="";
  renderMonth();
  bindWeightInput();
  showMsg("运动已添加");
}

function deleteExercise(idx){
  const dayKey = getSelectedDateStr();
  const all = getAllRecords();
  if(all[dayKey] && Array.isArray(all[dayKey].exercises)){
    all[dayKey].exercises.splice(idx,1);
    saveAllRecords(all);
  }
  renderMonth();
  bindWeightInput();
}

function deleteItem(dayStr, tsIndex){
  const all = getAllRecords();
  if(all[dayStr] && Array.isArray(all[dayStr].items)){
    all[dayStr].items.splice(tsIndex,1);
    saveAllRecords(all);
  }
  renderMonth();
  showDayDetail(dayStr);
}

function clearToday(){
  const dayKey = getSelectedDateStr();
  const all = getAllRecords();
  delete all[dayKey];
  saveAllRecords(all);
  renderMonth();
  bindWeightInput();
  showMsg(`【${dayKey}】全部记录清空`);
}

function getDayTotal(dayData){
  if(!dayData) return {kcal:0, pro:0, exBurn:0, fib:0};
  let kcal=0,pro=0,exBurn=0,fib=0;
  if(Array.isArray(dayData.items)){
    dayData.items.forEach(i=>{
      kcal += i.kcal;
      pro += i.pro;
      fib += i.fib || 0;
    })
  }
  if(Array.isArray(dayData.exercises)){
    dayData.exercises.forEach(e=>{
      exBurn += e.burn;
    })
  }
  return {kcal,pro,exBurn,fib, net: kcal - exBurn};
}

function getCalClass(kcal){
  if(kcal === 0) return "cal-empty";
  if(kcal < 800) return "cal-low";
  if(kcal <=1000) return "cal-good";
  return "cal-over";
}

function renderMonth(){
  const picker = document.getElementById("monthPicker");
  if(!picker.value){
    const now = new Date();
    picker.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  }
  const [year,month] = picker.value.split("-").map(Number);
  const allRecords = getAllRecords();
  const calendarBox = document.getElementById("calendarBox");
  const detailBox = document.getElementById("dayDetailBox");
  detailBox.style.display = "none";

  const firstDay = new Date(year, month-1, 1);
  const firstWeekDay = firstDay.getDay(); // 0=周日
  const daysInMonth = new Date(year, month, 0).getDate();
  let calHtml = "";

  // 空白占位格子，用来对齐1号到正确星期
  for(let i=0; i<firstWeekDay; i++){
    calHtml += `<div class="calendar-day" style="visibility:hidden;"></div>`;
  }

  for(let d=1;d<=daysInMonth;d++){
    const dayStr = `${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayData = allRecords[dayStr];
    const dayTotal = getDayTotal(dayData);
    const cls = getCalClass(dayTotal.kcal);

    let wm = (dayData?.wMorning) || "-";
    let wn = (dayData?.wNight) || "-";
    calHtml += `<div class="calendar-day ${cls}" onclick="showDayDetail('${dayStr}')">
      ${d}号<br/>${dayTotal.kcal}kcal<br/>早:${wm}<br/>晚:${wn}
    </div>`
  }
  calendarBox.innerHTML = calHtml;
  bindWeightInput();
}

function copyTodayLog(){
  const dayKey = getSelectedDateStr();
  const allRecords = getAllRecords();
  const dayData = allRecords[dayKey];
  if(!dayData || !Array.isArray(dayData.items) || dayData.items.length===0){
    showMsg("该日期还没有记录",false);
    return;
  }
  const mealMap = {breakfast:"早餐",lunch:"午餐",dinner:"晚餐",snack:"加餐"};
  let outputText = `【${dayKey} 饮食记录，多囊减脂，请帮我点评+给建议】\n`;
  if(dayData.wMorning) outputText += `晨起体重：${dayData.wMorning}kg\n`;
  if(dayData.wNight) outputText += `晚间体重：${dayData.wNight}kg\n`;

  dayData.items.forEach(it=>{
    outputText += `${mealMap[it.meal]}：${it.foodText}\n热量：${it.kcal}kcal，蛋白${it.pro}g，碳水${it.cho}g，脂肪${it.fat}g，膳食纤维${it.fib||0}g\n`;
  })
  const total = getDayTotal(dayData);
  outputText += `\n👉今日合计：总热量${total.kcal} kcal，运动消耗${total.exBurn} kcal，净摄入${total.net}kcal，总蛋白${total.pro} g，膳食纤维${total.fib.toFixed(1)} g\n`;
  if(Array.isArray(dayData.exercises) && dayData.exercises.length>0){
    outputText += `👉运动记录：\n`;
    dayData.exercises.forEach(e=>outputText+=`${e.name}，消耗${e.burn}kcal\n`);
  }

  navigator.clipboard.writeText(outputText).then(()=>{
    showMsg("已复制记录");
  })
}

function saveAiAdvice(){
  const text = document.getElementById("aiSuggestInput").value.trim();
  const dayKey = getSelectedDateStr();
  const allRecords = getAllRecords();
  if(!allRecords[dayKey]) allRecords[dayKey]={items:[],exercises:[],advice:"",wMorning:"",wNight:""};
  allRecords[dayKey].advice = text;
  saveAllRecords(allRecords);
  renderMonth();
  showMsg("AI建议保存成功");
}

function exportJson(){
  const all = getAllRecords();
  const blob = new Blob([JSON.stringify(all,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url;
  a.download="diet_backup.json";
  a.click();
  URL.revokeObjectURL(url);
  showMsg("备份文件已下载");
}

function showDayDetail(dayStr){
  const allRecords = getAllRecords();
  const dayData = allRecords[dayStr];
  const detailBox = document.getElementById("dayDetailBox");
  if(!dayData || !Array.isArray(dayData.items) || dayData.items.length===0){
    let info = `<strong>${dayStr}</strong><br/>`;
    if(dayData){
      info += `早：${dayData.wMorning||"无记录"} kg｜晚：${dayData.wNight||"无记录"} kg<br/>`;
      if(Array.isArray(dayData.exercises)&&dayData.exercises.length>0){
        info += `<br/>运动记录：<br/>`;
        dayData.exercises.forEach(ex=>info += `${ex.name}｜${ex.burn}kcal<br/>`)
      }
    }
    info += `该日暂无饮食记录`;
    detailBox.innerHTML = info;
    detailBox.style.display = "block";
    return;
  }
  const dayTotal = getDayTotal(dayData);
  const mealMap = {breakfast:"早餐",lunch:"午餐",dinner:"晚餐",snack:"加餐"};

  let html = `<div class="stat-line"><strong>${dayStr}</strong>　总热量 ${dayTotal.kcal} kcal｜运动消耗 ${dayTotal.exBurn} kcal｜净摄入 ${dayTotal.net} kcal｜蛋白 ${dayTotal.pro.toFixed(1)}g｜纤维 ${dayTotal.fib.toFixed(1)}g</div>`;
  html += `<span class="tip">早：${dayData.wMorning||"无记录"} kg｜晚：${dayData.wNight||"无记录"} kg</span>`;

  dayData.items.forEach((it,idx)=>{
    html += `
    <div class="meal-item">
      <div>
        <div>${mealMap[it.meal]}｜${it.foodText}</div>
        <div class="tip">${it.kcal}kcal 蛋白${it.pro}g 碳水${it.cho}g 脂肪${it.fat}g 纤维${it.fib||0}g</div>
        ${it.photo ? `<img class="photo-img" src="${it.photo}" onclick="openModal('${it.photo}')">` : ""}
      </div>
      <button class="btn-del" onclick="deleteItem('${dayStr}',${idx})">删除</button>
    </div>`
  })

  if(Array.isArray(dayData.exercises) && dayData.exercises.length>0){
    html += `<div style="margin-top:8px;"><strong>当日运动</strong></div>`;
    dayData.exercises.forEach((ex)=>{
      html += `<div class="ex-item">${ex.name}｜消耗 ${ex.burn} kcal</div>`
    })
  }

  if(dayData.advice){
    html += `<div class="advice-saved"><strong>保存的饮食建议：</strong><br>${dayData.advice}</div>`
  }
  detailBox.innerHTML = html;
  detailBox.style.display = "block";
}

// 页面初始化
document.getElementById("monthPicker").addEventListener("change",renderMonth);
// 补录日期切换事件，切换自动加载那天的体重、运动、统计
document.getElementById("recordDatePicker").addEventListener("change",bindWeightInput);

// 初始化默认选中今天
function initDatePicker(){
  const today = getTodayStr();
  document.getElementById("recordDatePicker").value = today;
}
initDatePicker();
renderMonth();
</script>
