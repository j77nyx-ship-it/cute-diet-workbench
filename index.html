<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>饮食小记</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body {
    background: #f7f7f5;
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
    color: #333;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin: 10px 0 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #ecece8;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  label {
    display: block;
    font-size: 14px;
    color: #666;
    margin: 10px 0 6px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #e5e5e1;
    border-radius: 12px;
    font-size: 16px;
    background: #fafaf7;
    outline: none;
  }
  input:focus, select:focus {
    border-color: #bbb;
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn-primary {
    background: #2a2a2a;
    color: #fff;
  }
  .btn-secondary {
    background: #ecece8;
    color: #333;
  }
  .btn-ghost {
    background: transparent;
    border: 1px solid #e5e5e1;
    color: #666;
  }
  .preview-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }
  .preview-item {
    background: #fafaf7;
    border: 1px solid #ecece8;
    border-radius: 14px;
    padding: 10px;
    text-align: center;
  }
  .preview-item img {
    max-width: 100%;
    border-radius: 10px;
  }
  .estimate {
    background: #fafaf7;
    border-radius: 14px;
    padding: 14px;
    margin-top: 14px;
  }
  .estimate p {
    margin: 6px 0;
    font-size: 15px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .cal-day {
    background: #fff;
    border: 1px solid #ecece8;
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
  }
  .cal-day.selected {
    background: #2a2a2a;
    color: #fff;
  }
  .cal-good { background: #eef6ee; }
  .cal-low { background: #eef4f8; }
  .cal-over { background: #fdf3e7; }
  .legend {
    font-size: 13px;
    color: #888;
    margin-top: 8px;
  }
  .record-item {
    background: #fafaf7;
    border: 1px solid #ecece8;
    border-radius: 14px;
    padding: 14px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .record-item img {
    max-width: 180px;
    border-radius: 10px;
    margin-top: 8px;
  }
  .trash {
    background: #f3f3f0;
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    cursor: pointer;
    color: #888;
  }
  .empty {
    color: #999;
    text-align: center;
    padding: 20px 0;
  }
  @media (max-width: 520px) {
    .preview-box { grid-template-columns: 1fr; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>
  <h1>饮食小记</h1>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span>当前日期</span>
      <strong id="targetDateText">今天</strong>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">上传照片</h3>
    <input type="file" id="imgUpload" accept="image/*" />

    <div class="preview-box" id="previewBox" style="display:none;">
      <div class="preview-item">
        <div style="font-size:13px;color:#888;margin-bottom:6px;">原图</div>
        <img id="originalImg" />
      </div>
      <div class="preview-item">
        <div style="font-size:13px;color:#888;margin-bottom:6px;">插画预览</div>
        <img id="illustrationImg" />
      </div>
    </div>

    <button class="btn-secondary" onclick="goGenerateIllustration()">生成插画参考</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">简单记录</h3>

    <label>这份总热量（大卡）</label>
    <input type="number" id="totalKcalInput" placeholder="例如：800" />

    <label>几个人吃</label>
    <select id="peopleSel">
      <option value="1">1人</option>
      <option value="2">2人</option>
      <option value="3" selected>3人</option>
      <option value="4">4人</option>
      <option value="5">5人</option>
      <option value="6">6人</option>
    </select>

    <label>备注（可选）</label>
    <input id="noteInput" placeholder="例如：鸡腿肉，油比较多" />

    <div class="estimate">
      <p>你这一份估算热量：<strong id="onePersonKcal">--</strong></p>
      <p style="font-size:13px;color:#888;margin-top:6px;">
        算法：总热量 ÷ 人数
      </p>
    </div>

    <button class="btn-primary" onclick="addRecord()">添加到当天</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">日历</h3>
    <input type="month" id="monthSel" />
    <div class="calendar-grid" id="calendarBox"></div>
    <div class="legend">绿色 800-1000kcal · 蓝色 ＜800kcal · 橙色 ＞1000kcal</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">当日记录</h3>
    <div id="detailBox"></div>
  </div>

<script>
  let records = JSON.parse(localStorage.getItem("dietRecords") || "{}");
  let targetDate = new Date().toISOString().slice(0, 10);
  let originalImgData = null;
  let illustrationImgData = null;

  const monthSel = document.getElementById("monthSel");
  const targetDateText = document.getElementById("targetDateText");
  const imgUpload = document.getElementById("imgUpload");
  const previewBox = document.getElementById("previewBox");
  const originalImg = document.getElementById("originalImg");
  const illustrationImg = document.getElementById("illustrationImg");
  const totalKcalInput = document.getElementById("totalKcalInput");
  const peopleSel = document.getElementById("peopleSel");
  const noteInput = document.getElementById("noteInput");

  function init() {
    const now = new Date();
    monthSel.value = now.toISOString().slice(0, 7);
    targetDateText.textContent = targetDate;
    updateEstimate();
    renderAll();
  }

  imgUpload.onchange = function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement("canvas");
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        originalImgData = canvas.toDataURL("image/jpeg", 0.75);
        originalImg.src = originalImgData;
        previewBox.style.display = "grid";
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  function goGenerateIllustration() {
    if (!originalImgData) {
      alert("请先上传照片");
      return;
    }
    alert("请把原图保存后，上传到 AI 生图工具生成极简纸感插画，再把插画传回来。");
  }

  function updateEstimate() {
    const total = parseFloat(totalKcalInput.value);
    const people = parseFloat(peopleSel.value) || 1;
    if (isNaN(total)) {
      document.getElementById("onePersonKcal").textContent = "--";
      return;
    }
    document.getElementById("onePersonKcal").textContent = Math.round(total / people) + " 大卡";
  }

  totalKcalInput.addEventListener("input", updateEstimate);
  peopleSel.addEventListener("input", updateEstimate);

  function addRecord() {
    const total = parseFloat(totalKcalInput.value);
    const people = parseFloat(peopleSel.value) || 1;

    if (isNaN(total)) {
      alert("请填写总热量");
      return;
    }

    if (!records[targetDate]) records[targetDate] = [];
    records[targetDate].push({
      id: Date.now(),
      totalKcal: total,
      people: people,
      oneKcal: Math.round(total / people),
      note: noteInput.value.trim(),
      photo: originalImgData,
      illustration: illustrationImgData
    });

    save();
    totalKcalInput.value = "";
    noteInput.value = "";
    imgUpload.value = "";
    previewBox.style.display = "none";
    originalImgData = null;
    illustrationImgData = null;
    updateEstimate();
    renderAll();
    alert("已添加到 " + targetDate);
  }

  function deleteRecord(id) {
    if (!confirm("删除这条记录？")) return;
    records[targetDate] = records[targetDate].filter(r => r.id !== id);
    if (records[targetDate].length === 0) delete records[targetDate];
    save();
    renderAll();
  }

  function save() {
    localStorage.setItem("dietRecords", JSON.stringify(records));
  }

  function selectDay(dayStr) {
    targetDate = dayStr;
    targetDateText.textContent = targetDate;
    renderAll();
  }

  function getDaySum(dayStr) {
    const items = records[dayStr] || [];
    let kcal = 0;
    items.forEach(r => kcal += r.oneKcal || 0);
    return kcal;
  }

  function getCalClass(kcal) {
    if (kcal === 0) return "";
    if (kcal < 800) return "cal-low";
    if (kcal <= 1000) return "cal-good";
    return "cal-over";
  }

  function renderCalendar() {
    const [y, m] = monthSel.value.split("-").map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    const firstWeekDay = new Date(y, m - 1, 1).getDay();
    const box = document.getElementById("calendarBox");
    box.innerHTML = "";

    for (let i = 0; i < firstWeekDay; i++) {
      const empty = document.createElement("div");
      empty.style.visibility = "hidden";
      box.appendChild(empty);
    }

    for (let d = 1; d <= lastDay; d++) {
      const dayStr = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const sum = getDaySum(dayStr);
      const div = document.createElement("div");
      div.className = "cal-day " + getCalClass(sum) + (dayStr === targetDate ? " selected" : "");
      div.textContent = d + "日";
      div.onclick = () => selectDay(dayStr);
      box.appendChild(div);
    }
  }

  function renderDetail() {
    const box = document.getElementById("detailBox");
    const items = records[targetDate] || [];

    if (items.length === 0) {
      box.innerHTML = `<div class="empty">${targetDate} 暂无记录</div>`;
      return;
    }

    let html = "";
    items.forEach(r => {
      html += `
        <div class="record-item">
          <div>
            <div><strong>${r.oneKcal} 大卡</strong></div>
            <div style="font-size:14px;color:#888;margin-top:4px;">
              总热量 ${r.totalKcal} 大卡 · ${r.people}人分
            </div>
            ${r.note ? `<div style="font-size:14px;color:#666;margin-top:4px;">${r.note}</div>` : ""}
            ${r.photo ? `<img src="${r.photo}" />` : ""}
          </div>
          <button class="trash" onclick="deleteRecord(${r.id})">删除</button>
        </div>`;
    });

    box.innerHTML = html;
  }

  function renderAll() {
    renderCalendar();
    renderDetail();
  }

  monthSel.addEventListener("change", renderCalendar);
  init();
</script>
</body>
</html>
