<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多囊饮食体重记录</title>
    <style>
        body {font-family: system-ui, sans-serif;max-width:1100px;margin:20px auto;padding:0 20px;}
        .card {border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:16px;}
        .row {display:flex;gap:12px;flex-wrap:wrap;margin:8px 0;}
        input, select {padding:8px;border:1px solid #ccc;border-radius:6px;}
        button {padding:8px 14px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer;}
        button.del {background:#ef4444;}
        .stat {background:#f0f7ff;padding:12px;border-radius:8px;flex:1;min-width:180px;text-align:center;}
    </style>
</head>
<body>
    <h1>多囊饮食&体重记录</h1>

    <div class="card">
        <h3>今日体重</h3>
        <div class="row">
            <div>
                <label>晨起体重(kg)</label>
                <input type="number" step="0.01" id="wMorning">
            </div>
            <div>
                <label>晚间体重(kg)</label>
                <input type="number" step="0.01" id="wNight">
            </div>
        </div>
    </div>

    <div class="card">
        <h3>添加饮食记录</h3>
        <div class="row">
            <select id="meal">
                <option>早餐</option>
                <option>午餐</option>
                <option>晚餐</option>
                <option>加餐</option>
            </select>
            <input type="text" id="foodName" placeholder="食物名称">
            <input type="number" id="foodKcal" placeholder="热量kcal" min="0">
            <input type="number" id="foodPro" placeholder="蛋白g" min="0">
            <input type="number" id="foodCarb" placeholder="碳水g" min="0">
            <input type="number" id="foodFat" placeholder="脂肪g" min="0">
            <button onclick="addFood()">添加食物</button>
        </div>
    </div>

    <div class="card">
        <h3>运动消耗</h3>
        <div class="row">
            <input type="text" id="exName" placeholder="运动名称">
            <input type="number" id="exKcal" placeholder="消耗热量kcal" min="0">
            <button onclick="addExercise()">添加运动</button>
        </div>
    </div>

    <div class="card">
        <h3>今日汇总</h3>
        <div class="row">
            <div class="stat"><h4>总摄入热量</h4><div id="totalIntake">0 kcal</div></div>
            <div class="stat"><h4>运动总消耗</h4><div id="totalEx">0 kcal</div></div>
            <div class="stat"><h4>净摄入热量</h4><div id="netKcal">0 kcal</div></div>
        </div>
        <p>晨起体重：<span id="showMorning">--</span> kg｜晚间体重：<span id="showNight">--</span> kg</p>
    </div>

    <div class="card">
        <h3>饮食明细</h3>
        <div id="foodList"></div>
    </div>

    <div class="card">
        <h3>运动明细</h3>
        <div id="exList"></div>
    </div>

    <button class="del" onclick="clearAll()">清空全部记录</button>

<script>
// 读取本地存储
let data = JSON.parse(localStorage.getItem("dietData")) || {
    weightMorning: "",
    weightNight: "",
    foods: [],
    exercises: []
};

function save(){
    localStorage.setItem("dietData", JSON.stringify(data));
}

// 体重
function renderWeight(){
    document.getElementById("wMorning").value = data.weightMorning;
    document.getElementById("wNight").value = data.weightNight;
    document.getElementById("showMorning").innerText = data.weightMorning || "--";
    document.getElementById("showNight").innerText = data.weightNight || "--";
}
document.getElementById("wMorning").oninput = e=>{data.weightMorning = e.target.value;save();renderAll();}
document.getElementById("wNight").oninput = e=>{data.weightNight = e.target.value;save();renderAll();}

// 添加食物
function addFood(){
    const meal = document.getElementById("meal").value;
    const name = document.getElementById("foodName").value;
    const kcal = Number(document.getElementById("foodKcal").value||0);
    const pro = Number(document.getElementById("foodPro").value||0);
    const carb = Number(document.getElementById("foodCarb").value||0);
    const fat = Number(document.getElementById("foodFat").value||0);
    data.foods.push({meal,name,kcal,pro,carb,fat});
    save();renderAll();
    //清空输入框
    document.getElementById("foodName").value="";
    document.getElementById("foodKcal").value="";
    document.getElementById("foodPro").value="";
    document.getElementById("foodCarb").value="";
    document.getElementById("foodFat").value="";
}

// 添加运动
function addExercise(){
    const name = document.getElementById("exName").value;
    const kcal = Number(document.getElementById("exKcal").value||0);
    data.exercises.push({name,kcal});
    save();renderAll();
    document.getElementById("exName").value="";
    document.getElementById("exKcal").value="";
}

// 渲染全部
function renderAll(){
    renderWeight();
    // 计算汇总
    let totalIntake = data.foods.reduce((s,i)=>s+i.kcal,0);
    let totalEx = data.exercises.reduce((s,i)=>s+i.kcal,0);
    let net = totalIntake - totalEx;
    document.getElementById("totalIntake").innerText = totalIntake + " kcal";
    document.getElementById("totalEx").innerText = totalEx + " kcal";
    document.getElementById("netKcal").innerText = net + " kcal";

    // 饮食列表
    let foodHtml = "";
    data.foods.forEach((item,idx)=>{
        foodHtml += `<p>${item.meal}｜${item.name}｜${item.kcal}kcal｜蛋白${item.pro}g｜碳水${item.carb}g｜脂肪${item.fat}g
        <button onclick="delFood(${idx})">删除</button></p>`
    })
    document.getElementById("foodList").innerHTML = foodHtml;

    //运动列表
    let exHtml = "";
    data.exercises.forEach((item,idx)=>{
        exHtml += `<p>${item.name}｜消耗 ${item.kcal} kcal <button onclick="delEx(${idx})">删除</button></p>`
    })
    document.getElementById("exList").innerHTML = exHtml;
}

function delFood(idx){data.foods.splice(idx,1);save();renderAll();}
function delEx(idx){data.exercises.splice(idx,1);save();renderAll();}
function clearAll(){
    if(confirm("确定清空今日所有记录？")){
        data = {weightMorning:"",weightNight:"",foods:[],exercises:[]};
        save();renderAll();
    }
}

renderAll();
</script>
</body>
</html>
