<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>饮食记录小本本</title>
<style>
  * { box-sizing: border-box; font-family: "Segoe UI", system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #ffeef8 0%, #fff5fb 100%);
    padding: 16px;
    max-width: 820px;
    margin: 0 auto;
    color: #4a3b46;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 8px 0 18px;
  }
  .card {
    background: #fff;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 6px 18px #ffd6e880;
    border: 2px solid #ffd1e8;
  }
  .row4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .metric {
    background: #ffe4f3;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .metric strong {
    display: block;
    font-size: 17px;
    margin-top: 4px;
    color: #d63384;
  }
  label {
    display: block;
    font-size: 14px;
    color: #7a5c72;
    margin: 12px 0 6px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border: 2px solid #ffd1e8;
    border-radius: 14px;
    margin: 6px 0;
    font-size: 16px;
    background: #fff;
    outline: none;
  }
  input:focus, select:focus {
    border-color: #ff7ac6;
  }
  button {
    padding: 12px 16px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    cursor: pointer;
    margin: 10px 6px 6px 0;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff7ac6, #ff9ed4);
    color: white;
    box-shadow: 0 4px 10px #ff9ed480;
  }
  .btn-gray {
    background: #eee5ec;
    color: #5c4a58;
  }
  .result-box {
    background: linear-gradient(135deg, #fff0f9, #ffe4f3);
    border-radius: 16px;
    padding: 14px;
    margin-top: 14px;
  }
  .result-box p {
    margin: 6px 0;
  }
  .img-preview {
    max-width: 240px;
    border-radius: 14px;
    margin-top: 10px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .cal-day {
    background: #fff0f9;
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .cal-day:hover {
    background: #ffe4f3;
  }
  .cal-day.selected {
    background: #ff7ac6;
    color: white;
    border-color: #ff7ac6;
  }
  .cal-good { background: #dff7e6; }
  .cal-low { background: #dff0ff; }
  .cal-over { background: #ffe7cc; }
  .legend {
    text-align: center;
    font-size: 13px;
    margin: 8px 0;
    color: #7a5c72;
  }
  .detail-item {
    background: #fff0f9;
    border-radius: 16px;
    padding: 14px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border: 2px solid #ffd1e8;
  }
  .detail-item img {
    max-width: 220px;
    border-radius: 12px;
    margin-top: 8px;
  }
  .trash {
    background: #ffd9e6;
    color: #d63384;
    border: none;
    border-radius: 12px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 16px;
  }
  .backup-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  @media (max-width: 520px) {
    .row4 { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<body>
  <h1>饮食记录小本本</h1>

  <div class="row4">
    <div class="metric">当前日期<br><strong id="targetDateText">今天</strong></div>
    <div class="metric">今日总热量<br><strong id="todayKcal">0 kcal</strong></div>
    <div class="metric">今日蛋白质<br><strong id="todayPro">0 g</strong></div>
    <div class="metric">热量差<br><strong id="deficit">-- kcal</strong></div>
  </div>

  <div class="card">
    <h3>添加记录</h3>

    <label>上传食物照片</label>
    <input type="file" id="imgUpload" accept="image/*" />
    <img id="imgPreview" class="img-preview" style="display:none;" />

    <label>这份总热量（大卡）</label>
    <input type="number" id="totalKcalInput" placeholder="例如：整锅 800" />

    <label>几个人吃</label>
    <select id="peopleSel">
      <option value="1">1人</option>
      <option value="2">2人</option>
      <option value="3" selected>3人</option>
      <option value="4">4人</option>
      <option value="5">5人</option>
      <option value="6">6人</option>
    </select>

    <label>备注（可选）</label>
    <input id="noteInput" placeholder="例如：鸡腿肉，油比较多" />

    <div class="result-box">
      <p>你这一份估算热量：<strong id="onePersonKcal">-- kcal</strong></p>
    </div>

    <button class="btn-primary" onclick="addRecord()">添加到当天</button>
    <button class="btn-gray" onclick="clearDay()">清空当天</button>
  </div>

  <div class="card">
    <h3>备份 / 恢复</h3>
    <div class="backup-row">
      <button class="btn-primary" onclick="exportData()">导出备份</button>
      <button class="btn-gray" onclick="document.getElementById('importFile').click()">导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
    </div>
  </div>

  <div class="card">
    <h3>日历补录</h3>
    <div class="legend">绿色800-1000kcal｜蓝色＜800kcal｜橙色＞1000kcal</div>
    <input type="month" id="monthSel" />
    <div class="calendar-grid" id="calendarBox"></div>
  </div>

  <div class="card">
    <h3>当日明细</h3>
    <div id="detailBox"></div>
  </div>

<script>
  const DAILY_TARGET = 1000;
  let records = JSON.parse(localStorage.getItem("dietRecords") || "{}");
  let targetDate = new Date().toISOString().slice(0, 10);
  let imgData = null;

  const monthSel = document.getElementById("monthSel");
  const targetDateText = document.getElementById("targetDateText");
  const imgUpload = document.getElementById("imgUpload");
  const imgPreview = document.getElementById("imgPreview");
  const peopleSel = document.getElementById("peopleSel");
  const totalKcalInput = document.getElementById("totalKcalInput");
  const noteInput = document.getElementById("noteInput");

  function init() {
    const now = new Date();
    monthSel.value = now.toISOString().slice(0, 7);
    targetDateText.textContent = targetDate;
    updateEstimate();
    renderAll();
  }

  imgUpload.onchange = function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement("canvas");
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        imgData = canvas.toDataURL("image/jpeg", 0.75);
        imgPreview.src = imgData;
        imgPreview.style.display = "inline-block";
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  function updateEstimate() {
    const people = parseFloat(peopleSel.value) || 1;
    const totalKcal = parseFloat(totalKcalInput.value) || 0;
    document.getElementById("onePersonKcal").textContent =
      totalKcal > 0 ? Math.round(totalKcal / people) + " kcal" : "-- kcal";
  }

  peopleSel.addEventListener("input", updateEstimate);
  totalKcalInput.addEventListener("input", updateEstimate);

  function addRecord() {
    const people = parseFloat(peopleSel.value) || 1;
    const totalKcal = parseFloat(totalKcalInput.value);

    if (isNaN(totalKcal)) {
      alert("请填写这份总热量");
      return;
    }

    const oneKcal = Math.round(totalKcal / people);

    if (!records[targetDate]) records[targetDate] = [];
    records[targetDate].push({
      id: Date.now(),
      people: people,
      totalKcal: totalKcal,
      oneKcal: oneKcal,
      note: noteInput.value.trim(),
      photo: imgData
    });

    save();
    totalKcalInput.value = "";
    noteInput.value = "";
    imgUpload.value = "";
    imgPreview.style.display = "none";
    imgData = null;
    updateEstimate();
    renderAll();
    alert("已添加到 " + targetDate);
  }

  function deleteRecord(id) {
    if (!confirm("删除这条记录吗？")) return;
    records[targetDate] = records[targetDate].filter(r => r.id !== id);
    if (records[targetDate].length === 0) delete records[targetDate];
    save();
    renderAll();
  }

  function clearDay() {
    if (!confirm("清空当天全部记录？")) return;
    delete records[targetDate];
    save();
    renderAll();
  }

  function save() {
    localStorage.setItem("dietRecords", JSON.stringify(records));
  }

  function selectDay(dayStr) {
    targetDate = dayStr;
    targetDateText.textContent = targetDate;
    renderAll();
  }

  function getDaySum(dayStr) {
    const items = records[dayStr] || [];
    let kcal = 0;
    items.forEach(r => kcal += r.oneKcal || 0);
    return kcal;
  }

  function getCalClass(kcal) {
    if (kcal === 0) return "";
    if (kcal < 800) return "cal-low";
    if (kcal <= 1000) return "cal-good";
    return "cal-over";
  }

  function renderCalendar() {
    const [y, m] = monthSel.value.split("-").map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    const firstWeekDay = new Date(y, m - 1, 1).getDay();
    const box = document.getElementById("calendarBox");
    box.innerHTML = "";

    for (let i = 0; i < firstWeekDay; i++) {
      const empty = document.createElement("div");
      empty.style.visibility = "hidden";
      box.appendChild(empty);
    }

    for (let d = 1; d <= lastDay; d++) {
      const dayStr = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const sum = getDaySum(dayStr);
      const div = document.createElement("div");
      div.className = "cal-day " + getCalClass(sum) + (dayStr === targetDate ? " selected" : "");
      div.innerHTML = `${d}号<br>${sum}kcal`;
      div.onclick = () => selectDay(dayStr);
      box.appendChild(div);
    }
  }

  function renderDetail() {
    const box = document.getElementById("detailBox");
    const items = records[targetDate] || [];
    if (items.length === 0) {
      box.innerHTML = `<p>${targetDate} 还没有记录</p>`;
      return;
    }

    let html = `<p><strong>${targetDate}</strong>｜今日总热量：${getDaySum(targetDate)} kcal</p>`;

    items.forEach(r => {
      html += `
        <div class="detail-item">
          <div>
            <div><strong>${r.oneKcal} kcal</strong></div>
            <div style="font-size:14px;color:#7a5c72;margin-top:4px;">
              ${r.people}人分｜整份 ${r.totalKcal}kcal
            </div>
            ${r.note ? `<div style="font-size:14px;color:#7a5c72;margin-top:4px;">${r.note}</div>` : ""}
            ${r.photo ? `<img src="${r.photo}">` : ""}
          </div>
          <button class="trash" onclick="deleteRecord(${r.id})">删除</button>
        </div>`;
    });

    box.innerHTML = html;
  }

  function renderTopMetrics() {
    const today = new Date().toISOString().slice(0, 10);
    const kcal = getDaySum(today);
    document.getElementById("todayKcal").textContent = kcal + " kcal";
    document.getElementById("deficit").textContent = (DAILY_TARGET - kcal) + " kcal";
  }

  function renderAll() {
    renderCalendar();
    renderDetail();
    renderTopMetrics();
  }

  monthSel.addEventListener("change", renderCalendar);

  function exportData() {
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `diet_backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (!confirm("导入将合并记录，同一天数据会覆盖，确定继续吗？")) return;
        records = { ...records, ...imported };
        save();
        renderAll();
        alert("导入成功");
      } catch (err) {
        alert("备份文件解析失败");
      }
    };
    reader.readAsText(file);
  }

  init();
</script>
</body>
</html>
