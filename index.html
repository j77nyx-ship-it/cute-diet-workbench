<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>饮食记录小本本</title>
<style>
  * { box-sizing: border-box; font-family: "Segoe UI", system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #ffeef8 0%, #fff5fb 100%);
    padding: 16px;
    max-width: 820px;
    margin: 0 auto;
    color: #4a3b46;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin: 8px 0 18px;
  }
  .card {
    background: #fff;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 6px 18px #ffd6e880;
    border: 2px solid #ffd1e8;
  }
  .row4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .metric {
    background: #ffe4f3;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .metric strong {
    display: block;
    font-size: 18px;
    margin-top: 4px;
    color: #d63384;
  }
  .tip {
    background: #fff0f9;
    border-left: 4px solid #ff7ac6;
    padding: 10px 12px;
    border-radius: 10px;
    margin: 10px 0;
    font-size: 14px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border: 2px solid #ffd1e8;
    border-radius: 14px;
    margin: 8px 0;
    font-size: 16px;
    background: #fff;
    outline: none;
  }
  input:focus, select:focus {
    border-color: #ff7ac6;
  }
  button {
    padding: 12px 16px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    cursor: pointer;
    margin: 6px 4px 6px 0;
    transition: 0.15s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff7ac6, #ff9ed4);
    color: white;
    box-shadow: 0 4px 10px #ff9ed480;
  }
  .btn-gray {
    background: #eee5ec;
    color: #5c4a58;
  }
  .btn-danger {
    background: #ffd9e6;
    color: #d63384;
  }
  .img-preview-wrap{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    margin:12px 0;
  }
  .img-preview-item{
    background:#fff0f9;
    border-radius:14px;
    padding:10px;
    text-align:center;
  }
  .img-preview-item img{
    max-width:100%;
    border-radius:10px;
  }
  .result-box {
    background: linear-gradient(135deg, #fff0f9, #ffe4f3);
    border-radius: 16px;
    padding: 14px;
    margin-top: 12px;
  }
  .result-box p {
    margin: 6px 0;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .cal-day {
    background: #fff0f9;
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .cal-day:hover {
    background: #ffe4f3;
  }
  .cal-day.selected {
    background: #ff7ac6;
    color: white;
    border-color: #ff7ac6;
  }
  .cal-good { background: #dff7e6; }
  .cal-low { background: #dff0ff; }
  .cal-over { background: #ffe7cc; }
  .legend {
    text-align: center;
    font-size: 13px;
    margin: 8px 0;
    color: #7a5c72;
  }
  .detail-item {
    background: #fff0f9;
    border-radius: 16px;
    padding: 14px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border: 2px solid #ffd1e8;
  }
  .detail-item img {
    max-width: 220px;
    border-radius: 12px;
    margin-top: 8px;
  }
  .trash {
    background: #ffd9e6;
    color: #d63384;
    border: none;
    border-radius: 12px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 16px;
  }
  .backup-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  @media (max-width: 520px) {
    .img-preview-wrap{grid-template-columns:1fr;}
    .row4 { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<body>
  <h1>饮食记录小本本</h1>

  <div class="row4">
    <div class="metric">当前日期<br><strong id="targetDateText">今天</strong></div>
    <div class="metric">今日总热量<br><strong id="todayKcal">0 kcal</strong></div>
    <div class="metric">今日蛋白质<br><strong id="todayPro">0 g</strong></div>
    <div class="metric">热量差<br><strong id="deficit">-- kcal</strong></div>
  </div>

  <div class="card">
    <h3>照片与插画</h3>
    <label>上传实物原图</label>
    <input type="file" id="imgUploadOriginal" accept="image/*" />
    <label>上传生成后的手绘插画</label>
    <input type="file" id="imgUploadIllust" accept="image/*" />

    <div class="img-preview-wrap" id="previewWrap" style="display:none;">
      <div class="img-preview-item">
        <div style="font-size:13px;color:#7a5c72;margin-bottom:6px;">实物原图</div>
        <img id="previewOriginal"/>
      </div>
      <div class="img-preview-item">
        <div style="font-size:13px;color:#7a5c72;margin-bottom:6px;">极简插画</div>
        <img id="previewIllust"/>
      </div>
    </div>

    <div class="tip">
      上传食物照片，自行生成丙烯纸感极简插画，插画上传填入；填写整份总热量、人数自动分摊计算个人摄入。
    </div>

    <label>这份是几个人吃的？</label>
    <select id="peopleSel">
      <option value="1">1人吃（我自己一份）</option>
      <option value="2">2人分</option>
      <option value="3" selected>3人分</option>
      <option value="4">4人分</option>
      <option value="5">5人分</option>
      <option value="6">6人分</option>
    </select>

    <label>这一份/一锅总热量大概多少大卡？</label>
    <input type="number" id="totalKcalInput" placeholder="例：整锅约 800 kcal" />

    <label>这一份/一锅总蛋白质大概多少克？</label>
    <input type="number" id="totalProInput" placeholder="例：整锅约 50 g" />

    <label>记录名称</label>
    <input id="foodNameInput" placeholder="例如：黄焖鸡米饭" />

    <label>备注（可选）</label>
    <input id="noteInput" placeholder="例：油比较多，蔬菜少" />

    <div class="result-box" id="estimateBox">
      <p>当前：<strong id="peopleShow">3人分</strong></p>
      <p>你这一份估算热量：<strong id="onePersonKcal">-- kcal</strong></p>
      <p>你这一份估算蛋白质：<strong id="onePersonPro">-- g</strong></p>
    </div>

    <button class="btn-primary" onclick="addRecord()">添加到当天</button>
    <button class="btn-gray" onclick="clearDay()">清空当天记录</button>
  </div>

  <div class="card">
    <h3>备份 / 恢复</h3>
    <div class="backup-row">
      <button class="btn-primary" onclick="exportData()">导出备份</button>
      <button class="btn-gray" onclick="document.getElementById('importFile').click()">导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
    </div>
  </div>

  <div class="card">
    <h3>日历补录</h3>
    <div class="legend">绿色800‑1000kcal｜蓝色＜800kcal｜橙色＞1000kcal｜空白无记录</div>
    <input type="month" id="monthSel" />
    <div class="calendar-grid" id="calendarBox"></div>
  </div>

  <div class="card">
    <h3>当日明细</h3>
    <div id="detailBox"></div>
  </div>

<script>
  const DAILY_TARGET = 1000;
  let records = JSON.parse(localStorage.getItem("dietRecords") || "{}");
  let targetDate = new Date().toISOString().slice(0, 10);
  let originalImgData = null;
  let illustImgData = null;

  const monthSel = document.getElementById("monthSel");
  const targetDateText = document.getElementById("targetDateText");
  const imgUploadOriginal = document.getElementById("imgUploadOriginal");
  const imgUploadIllust = document.getElementById("imgUploadIllust");
  const previewWrap = document.getElementById("previewWrap");
  const previewOriginal = document.getElementById("previewOriginal");
  const previewIllust = document.getElementById("previewIllust");
  const peopleSel = document.getElementById("peopleSel");
  const totalKcalInput = document.getElementById("totalKcalInput");
  const totalProInput = document.getElementById("totalProInput");
  const foodNameInput = document.getElementById("foodNameInput");
  const noteInput = document.getElementById("noteInput");

  function init() {
    const now = new Date();
    monthSel.value = now.toISOString().slice(0, 7);
    targetDateText.textContent = targetDate;
    updateEstimate();
    renderAll();
  }

  function readImage(file, callback){
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement("canvas");
        const maxW = 640;
        const scale = Math.min(1, maxW/img.width);
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        callback(canvas.toDataURL("image/jpeg",0.75));
      }
      img.src = ev.target.result;
    }
    reader.readAsDataURL(file);
  }

  imgUploadOriginal.onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    readImage(f, (data)=>{
      originalImgData = data;
      previewOriginal.src = data;
      previewWrap.style.display = "grid";
    })
  }
  imgUploadIllust.onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    readImage(f, (data)=>{
      illustImgData = data;
      previewIllust.src = data;
      previewWrap.style.display = "grid";
    })
  }

  function updateEstimate() {
    const people = parseFloat(peopleSel.value) || 1;
    const totalKcal = parseFloat(totalKcalInput.value) || 0;
    const totalPro = parseFloat(totalProInput.value) || 0;
    const oneKcal = totalKcal / people;
    const onePro = totalPro / people;
    document.getElementById("peopleShow").textContent = people + "人分";
    document.getElementById("onePersonKcal").textContent = oneKcal > 0 ? oneKcal.toFixed(0) + " kcal" : "-- kcal";
    document.getElementById("onePersonPro").textContent = onePro > 0 ? onePro.toFixed(1) + " g" : "-- g";
  }

  peopleSel.addEventListener("input", updateEstimate);
  totalKcalInput.addEventListener("input", updateEstimate);
  totalProInput.addEventListener("input", updateEstimate);

  function addRecord() {
    const people = parseFloat(peopleSel.value) || 1;
    const totalKcal = parseFloat(totalKcalInput.value);
    const totalPro = parseFloat(totalProInput.value) || 0;
    const foodName = foodNameInput.value.trim();

    if (isNaN(totalKcal)) {
      alert("请填写这份总热量");
      return;
    }

    const oneKcal = Math.round(totalKcal / people);
    const onePro = Math.round((totalPro / people) * 10) / 10;

    if (!records[targetDate]) records[targetDate] = [];
    records[targetDate].push({
      id: Date.now(),
      foodName: foodName,
      people: people,
      totalKcal: totalKcal,
      totalPro: totalPro,
      oneKcal: oneKcal,
      onePro: onePro,
      note: noteInput.value.trim(),
      photoOriginal: originalImgData,
      photoIllust: illustImgData
    });

    save();
    //清空输入
    totalKcalInput.value = "";
    totalProInput.value = "";
    foodNameInput.value = "";
    noteInput.value = "";
    imgUploadOriginal.value = "";
    imgUploadIllust.value = "";
    previewWrap.style.display = "none";
    originalImgData = null;
    illustImgData = null;
    updateEstimate();
    renderAll();
    alert("已添加到 " + targetDate);
  }

  function deleteRecord(id) {
    if (!confirm("删除这条记录吗？")) return;
    records[targetDate] = records[targetDate].filter(r => r.id !== id);
    if (records[targetDate].length === 0) delete records[targetDate];
    save();
    renderAll();
  }

  function clearDay() {
    if (!confirm("清空当天全部记录？")) return;
    delete records[targetDate];
    save();
    renderAll();
  }

  function save() {
    localStorage.setItem("dietRecords", JSON.stringify(records));
  }

  function selectDay(dayStr) {
    targetDate = dayStr;
    targetDateText.textContent = targetDate;
    renderAll();
  }

  function getDaySum(dayStr) {
    const items = records[dayStr] || [];
    let kcal = 0, pro = 0;
    items.forEach(r => {
      kcal += r.oneKcal || 0;
      pro += r.onePro || 0;
    });
    return { kcal, pro };
  }

  function getCalClass(kcal) {
    if (kcal === 0) return "";
    if (kcal < 800) return "cal-low";
    if (kcal <= 1000) return "cal-good";
    return "cal-over";
  }

  function renderCalendar() {
    const [y, m] = monthSel.value.split("-").map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    const firstWeekDay = new Date(y, m - 1, 1).getDay();
    const box = document.getElementById("calendarBox");
    box.innerHTML = "";

    for (let i = 0; i < firstWeekDay; i++) {
      const empty = document.createElement("div");
      empty.style.visibility = "hidden";
      box.appendChild(empty);
    }

    for (let d = 1; d <= lastDay; d++) {
      const dayStr = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const sum = getDaySum(dayStr);
      const div = document.createElement("div");
      div.className = "cal-day " + getCalClass(sum.kcal) + (dayStr === targetDate ? " selected" : "");
      div.innerHTML = `${d}号<br>${sum.kcal}kcal`;
      div.onclick = () => selectDay(dayStr);
      box.appendChild(div);
    }
  }

  function renderDetail() {
    const box = document.getElementById("detailBox");
    const items = records[targetDate] || [];
    if (items.length === 0) {
      box.innerHTML = `<p>${targetDate} 还没有记录</p>`;
      return;
    }

    const sum = getDaySum(targetDate);
    let html = `<p><strong>${targetDate}</strong>｜今日总热量：${sum.kcal} kcal｜蛋白质：${sum.pro.toFixed(1)} g</p>`;

    items.forEach(r => {
      html += `
        <div class="detail-item">
          <div>
            <div style="font-size:17px;"><strong>${r.foodName||"未命名记录"}</strong></div>
            <div style="font-size:14px;color:#7a5c72;margin-top:4px;">
              ${r.people}人分｜整份 ${r.totalKcal}kcal ${r.totalPro?"/ "+r.totalPro+"g蛋白":""}
            </div>
            <div style="font-size:14px;color:#d63384;margin-top:4px;">
              个人摄入：${r.oneKcal}kcal / ${r.onePro.toFixed(1)}g蛋白
            </div>
            ${r.note?`<div style="font-size:13px;color:#7a5c72;margin-top:4px;">${r.note}</div>`:""}
            <div style="display:flex;gap:8px;">
              ${r.photoOriginal?`<img src="${r.photoOriginal}">`:""}
              ${r.photoIllust?`<img src="${r.photoIllust}">`:""}
            </div>
          </div>
          <button class="trash" onclick="deleteRecord(${r.id})">删除</button>
        </div>`;
    });
    box.innerHTML = html;
  }

  function renderTopMetrics() {
    const today = new Date().toISOString().slice(0, 10);
    const sum = getDaySum(today);
    document.getElementById("todayKcal").textContent = sum.kcal + " kcal";
    document.getElementById("todayPro").textContent = sum.pro.toFixed(1) + " g";
    const deficit = DAILY_TARGET - sum.kcal;
    document.getElementById("deficit").textContent = deficit + " kcal";
  }

  function renderAll() {
    renderCalendar();
    renderDetail();
    renderTopMetrics();
  }

  monthSel.addEventListener("change", renderCalendar);

  function exportData() {
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `diet_backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (!confirm("导入将合并记录，同一天数据会覆盖，确定继续吗？")) return;
        records = { ...records, ...imported };
        save();
        renderAll();
        alert("导入成功");
      } catch (err) {
        alert("备份文件解析失败");
      }
    };
    reader.readAsText(file);
  }

  init();
</script>
</body>
</html>
